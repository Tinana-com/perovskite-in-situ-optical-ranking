name: Expand archived training source
on:
  push:
    branches: [repository-restructure-20261119]
    paths:
      - .github/workflows/expand-training-release.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Validate and extract frozen release
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, zipfile, os
          source = pathlib.Path("PL_SPATIAL_RANKING_TRAINING_REPRODUCTION_V1.zip")
          dest = pathlib.Path("training_release")
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None, "Archive CRC failure"
              manifest = json.loads(z.read("SHA256_MANIFEST.json"))
              members = [i for i in z.infolist() if not i.is_dir()]
              assert len(members) == len(manifest) + 1
              for m in members:
                  name = m.filename
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and ".." not in p.parts
                  assert m.file_size < 25_000_000, name
                  data = z.read(m)
                  if name != "SHA256_MANIFEST.json":
                      expected = manifest[name]
                      assert expected["bytes"] == len(data), name
                      assert expected["sha256"] == hashlib.sha256(data).hexdigest(), name
                  output = dest.joinpath(*p.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(data)
              assert sum(m.file_size for m in members) < 100_000_000
          print(f"Validated and expanded {len(members)} release files into {dest}/")
          PY
      - name: Commit unpacked, browsable sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training_release/
          if ! git diff --cached --quiet; then
            git commit -m "Expose validated frozen training source and archived results"
            git push origin HEAD:repository-restructure-20261119
          fi
